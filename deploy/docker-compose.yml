services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Чтобы DBeaver/psql с хоста подключались к той же БД, что и web (внутри сети compose хост — db).
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chess"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      # Перекрывает localhost из .env при работе внутри compose-сети
      DATABASE_URL: postgres://postgres:postgres@db:5432/chess
      DB_GENERATE_SCHEMAS: "true"
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/api/auth/google/callback}
      FRONTEND_AFTER_LOGIN_URL: ${FRONTEND_AFTER_LOGIN_URL:-http://localhost/}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    # Служебная проверка внутри образа (см. README «Нестандартно»); не дублирует пользовательские команды
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
