# Локальная разработка: Postgres + API (uvicorn --reload) + Vite (HMR).
# Запуск из корня репозитория:
#   docker compose -f deploy/docker-compose.dev.yml up --build
# Открыть фронт: http://127.0.0.1:5173 (прокси /api → сервис api).
#
# Переменные можно задать в корневом `.env` или через окружение; ниже — безопасные дефолты только для dev.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chess"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/chess
      DB_GENERATE_SCHEMAS: "true"
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-at-least-32-characters-long!!}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-jwt-secret-at-least-32-characters-long!!}
      COOKIE_SECURE: "false"
      # Иначе bind-mount с хоста часто не даёт inotify → uvicorn не перезапускается (особенно Docker Desktop).
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
      - frontend_dev_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_DEV_PROXY_API: http://api:8000
      # Включить polling в vite.config.js — иначе HMR часто не видит сохранения файлов в томе.
      VITE_DOCKER: "1"
    command:
      - sh
      - -c
      - |
        npm ci &&
        npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - api

volumes:
  postgres_dev_data:
  frontend_dev_node_modules:
