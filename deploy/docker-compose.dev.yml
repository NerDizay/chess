# Локальная разработка: только PostgreSQL. API и Vite — на хосте (см. README).
# Отдельный volume и порт 5432, чтобы не пересекаться с compose «продакшн».
#
# Запуск: docker compose -f deploy/docker-compose.dev.yml up -d
# Остановка: docker compose -f deploy/docker-compose.dev.yml down

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chess"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
