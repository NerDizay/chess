# Монтируется в контейнер как /etc/nginx/conf.d/default.conf (подменяет дефолтный welcome nginx).
# Все запросы на порт 80 уходят на FastAPI (статика и SPA с корня /). После правок: docker compose exec nginx nginx -s reload

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream chess_app {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location / {
        proxy_pass http://chess_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
    }
}
